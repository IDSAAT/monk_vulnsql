
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Monk's Vuln Lab | Login</title>

    <style>
        body {
            background-color: #000;
            color: #fff;
            font-family: Arial, sans-serif;
            min-height: 100vh;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .container {
            text-align: center;
            padding: 25px;
        }

        .logo {
            color: #d4af37;
            font-family: Georgia, serif;
            font-size: 30px;
            font-weight: bold;
            letter-spacing: 1px;
            margin-bottom: 30px;
        }

        form {
            margin-top: 20px;
        }

        input {
            padding: 9px;
            margin: 8px;
            background-color: #111;
            color: #fff;
            border: 1px solid #555;
            border-radius: 4px;
        }

        button {
            padding: 9px 20px;
            margin-top: 12px;
            background-color: #d4af37;
            color: #000;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
        }

        button:hover {
            background-color: #f0cf65;
        }

        .message {
            color: #fff;
            margin-top: 20px;
        }
    </style>
</head>

<body>
    <div class="container">

        <div class="logo">Monk's Vuln Lab</div>

        <h2>SQL Injection Lab</h2>

        <form method="POST">
            <div>
                <label for="username">Username</label><br>
                <input type="text" id="username" name="username" required>
            </div>

            <div>
                <label for="password">Password</label><br>
                <input type="password" id="password" name="password" required>
            </div>

            <button type="submit">Login</button>
        </form>

        <p class="message" style="white-space: pre-wrap;">{{ message }}</p>

    </div>
</body>
</html>
